name: site
on:
  push:
    branches: [main]
    paths: ["results/**", "tools/**", "strata_bench/**"]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_site.py
      - name: commit docs/data.json and docs/results/ when they changed
        run: |
          git add -A docs/data.json docs/results
          if ! git diff --cached --quiet; then
            git config user.name "strata-bench site"
            git config user.email "noreply@users.noreply.github.com"
            git commit -m "site: rebuild docs/data.json and docs/results"
            git push
          fi
