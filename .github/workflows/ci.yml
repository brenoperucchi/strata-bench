name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests
      - name: worker tests
        run: cd worker && npm test
      - name: schema.json is up to date
        run: python tools/build_validator_data.py --check
      - name: validate submitted results
        run: |
          shopt -s nullglob globstar
          files=(results/**/*.result.json)
          if [ ${#files[@]} -gt 0 ]; then python -m strata_bench validate "${files[@]}"; fi
